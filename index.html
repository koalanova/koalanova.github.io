<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoalaNova</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 64px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .logo span {
      color: #9B7FD4;
    }

    .tagline {
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 0.04em;
    }

    #products {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .product-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      background-color: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      color: #e8e8e8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
      position: relative;
      overflow: hidden;
    }

    .product-btn::after {
      content: "→";
      position: absolute;
      right: 20px;
      color: #9B7FD4;
      font-size: 1rem;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .product-btn:hover {
      background-color: #272033;
      border-color: #9B7FD4;
      transform: translateY(-1px);
    }

    .product-btn:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    .product-btn:active {
      transform: translateY(0);
    }

    .product-emoji {
      font-size: 1.3rem;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
    }

    .product-name {
      flex: 1;
      text-align: left;
      padding-right: 24px;
    }

    .accent-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #9B7FD4;
      flex-shrink: 0;
    }

    footer {
      margin-top: 56px;
      font-size: 0.78rem;
      color: #444;
      text-align: center;
      line-height: 1.6;
    }

    footer a {
      color: #9B7FD4;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .skeleton {
      background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 12px;
      height: 58px;
      border: 1px solid #1e1e1e;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🐨 Koala<span>Nova</span></div>
    <div class="tagline">Our favorite picks, curated for you</div>
  </header>

  <div id="products">
    <!-- Skeleton placeholders while loading -->
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <footer>
    <p>Links may be affiliate links. We may earn a commission at no extra cost to you.</p>
    <p style="margin-top:4px">© 2025 KoalaNova</p>
  </footer>

  <script>
    fetch('./products.json')
      .then(r => r.json())
      .then(products => {
        const container = document.getElementById('products');
        container.innerHTML = '';
        products.forEach(p => {
          const a = document.createElement('a');
          a.href = p.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer sponsored';
          a.className = 'product-btn';
          a.innerHTML = `
            <span class="accent-dot"></span>
            <span class="product-emoji">${p.emoji || '🛒'}</span>
            <span class="product-name">${p.name}</span>
          `;
          container.appendChild(a);
        });
      })
      .catch(() => {
        document.getElementById('products').innerHTML =
          '<p style="color:#666;text-align:center">Could not load products.</p>';
      });
  </script>

</body>
</html>
